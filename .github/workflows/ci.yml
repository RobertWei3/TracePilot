name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # No model key is injected here, so discovery-live.test.ts is always
    # skipped: a model's judgement is not a regression surface.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Run on every build: a cache hit skips the browser download, but the
      # system libraries it needs are not cached.
      - run: npx playwright install --with-deps chromium

      - run: npm run typecheck

      - run: npm test
